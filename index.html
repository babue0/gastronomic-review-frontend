<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Review Gastronômica</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="custom-navbar">
      <div class="container d-flex justify-content-between align-items-center">
        <div class="brand-text" style="cursor: pointer" onclick="showFeed()">
          Review Gastronômica
        </div>
        <div class="d-flex gap-2">
          <button
            id="btnProfile"
            class="btn btn-dark rounded-pill px-4 d-none"
            onclick="showProfile()"
          >
            Meu Perfil
          </button>
          <button
            id="btnLogout"
            class="btn btn-outline-danger rounded-pill px-4 d-none"
            onclick="logout()"
          >
            Sair
          </button>
        </div>
      </div>
    </nav>

    <div class="container pb-5">
      <div id="authSection" class="row justify-content-center mt-5">
        <div class="col-md-5">
          <div class="form-container">
            <div id="loginBox">
              <h3 class="text-center mb-4 fw-bold">Bem-vindo de volta!</h3>
              <form id="formLogin">
                <div class="mb-3">
                  <input
                    type="email"
                    id="loginEmail"
                    class="form-control"
                    placeholder="Seu E-mail"
                    required
                  />
                </div>
                <div class="mb-4">
                  <input
                    type="password"
                    id="loginPassword"
                    class="form-control"
                    placeholder="Sua Senha"
                    required
                  />
                </div>
                <button type="submit" class="btn-post w-100">
                  Entrar no App
                </button>
              </form>
              <p class="text-center mt-4 mb-0 text-muted">
                Ainda não tem conta?
                <a
                  href="#"
                  onclick="toggleAuth()"
                  class="text-primary fw-bold text-decoration-none"
                  >Criar agora</a
                >
              </p>
            </div>

            <div id="registerBox" class="d-none">
              <h3 class="text-center mb-4 fw-bold">Junte-se a nós!</h3>
              <form id="formRegister">
                <div class="mb-3">
                  <input
                    type="text"
                    id="regName"
                    class="form-control"
                    placeholder="Nome Completo"
                    required
                  />
                </div>
                <div class="mb-3">
                  <input
                    type="email"
                    id="regEmail"
                    class="form-control"
                    placeholder="E-mail"
                    required
                  />
                </div>
                <div class="mb-4">
                  <input
                    type="password"
                    id="regPassword"
                    class="form-control"
                    placeholder="Crie uma Senha"
                    required
                  />
                </div>
                <button
                  type="submit"
                  class="btn-post w-100"
                  style="background: linear-gradient(135deg, #2f3542, #57606f)"
                >
                  Finalizar Cadastro
                </button>
              </form>
              <p class="text-center mt-4 mb-0 text-muted">
                Já tem uma conta?
                <a
                  href="#"
                  onclick="toggleAuth()"
                  class="text-primary fw-bold text-decoration-none"
                  >Fazer login</a
                >
              </p>
            </div>
          </div>
        </div>
      </div>

      <div id="feedSection" class="d-none">
        <div class="row">
          <div class="col-lg-4 col-md-5 mb-4">
            <div class="form-container">
              <h4 class="fw-bold mb-4">Novo Review</h4>
              <form id="formReview">
                <div class="mb-3">
                  <input
                    type="text"
                    id="restaurantName"
                    class="form-control"
                    placeholder="Nome do Restaurante"
                    required
                  />
                </div>
                <div class="mb-3">
                  <select id="category" class="form-select" required>
                    <option value="">Escolha a categoria...</option>
                    <option value="Hambúrguer">🍔 Hambúrguer</option>
                    <option value="Pizza">🍕 Pizza</option>
                    <option value="Churrasco">🥩 Churrasco</option>
                    <option value="Japonês">🍣 Japonês</option>
                    <option value="Doce">🍦 Sobremesa</option>
                  </select>
                </div>
                <div class="mb-3">
                  <select id="rating" class="form-select" required>
                    <option value="">Sua nota...</option>
                    <option value="5">⭐⭐⭐⭐⭐ (Espetacular)</option>
                    <option value="4">⭐⭐⭐⭐ (Muito Bom)</option>
                    <option value="3">⭐⭐⭐ (Na média)</option>
                    <option value="2">⭐⭐ (Fraco)</option>
                    <option value="1">⭐ (Péssimo)</option>
                  </select>
                </div>
                <div class="mb-3">
                  <textarea
                    id="comment"
                    class="form-control"
                    rows="3"
                    placeholder="Conte como foi sua experiência..."
                    required
                  ></textarea>
                </div>
                <div class="mb-4">
                  <label class="form-label small fw-bold text-muted ms-1"
                    >FOTO DO PRATO</label
                  >
                  <input
                    type="file"
                    id="reviewImage"
                    class="form-control bg-white"
                    accept="image/*"
                    required
                  />
                </div>
                <button type="submit" class="btn-post w-100">
                  Publicar Avaliação
                </button>
              </form>
            </div>
          </div>

          <div class="col-lg-8 col-md-7">
            <div class="mb-4">
              <div
                class="input-group mb-3 shadow-sm"
                style="border-radius: 12px; overflow: hidden"
              >
                <input
                  type="text"
                  id="searchInput"
                  class="form-control border-0 bg-white py-2"
                  placeholder="Buscar restaurante (ex: Mocelim)..."
                />
                <button
                  class="btn btn-danger px-4 fw-bold"
                  onclick="searchRestaurant()"
                >
                  🔍 Buscar
                </button>
              </div>

              <div class="d-flex gap-2 flex-wrap" id="categoryFilters">
                <button
                  class="btn btn-sm btn-dark rounded-pill px-3"
                  onclick="filterCategory('', this)"
                >
                  Todos
                </button>
                <button
                  class="btn btn-sm btn-outline-dark rounded-pill px-3"
                  onclick="filterCategory('Hambúrguer', this)"
                >
                  🍔 Hambúrguer
                </button>
                <button
                  class="btn btn-sm btn-outline-dark rounded-pill px-3"
                  onclick="filterCategory('Pizza', this)"
                >
                  🍕 Pizza
                </button>
                <button
                  class="btn btn-sm btn-outline-dark rounded-pill px-3"
                  onclick="filterCategory('Churrasco', this)"
                >
                  🥩 Churrasco
                </button>
                <button
                  class="btn btn-sm btn-outline-dark rounded-pill px-3"
                  onclick="filterCategory('Japonês', this)"
                >
                  🍣 Japonês
                </button>
                <button
                  class="btn btn-sm btn-outline-dark rounded-pill px-3"
                  onclick="filterCategory('Doce', this)"
                >
                  🍦 Doce
                </button>
              </div>
            </div>

            <h4 class="fw-bold mb-4 ms-2">Últimas Avaliações da Galera</h4>

            <div class="row g-4" id="feedContainer"></div>
          </div>
        </div>
      </div>

      <div id="profileSection" class="d-none mt-4">
        <h3 class="fw-bold mb-4">Meu Perfil</h3>

        <div class="row mb-5">
          <div class="col-md-4 mb-3">
            <div
              class="card bg-danger text-white border-0 shadow-sm"
              style="border-radius: 20px"
            >
              <div class="card-body text-center py-4">
                <h1 class="display-4 fw-bold" id="statTotal">0</h1>
                <p
                  class="mb-0 text-white-50 fw-bold text-uppercase letter-spacing"
                >
                  Lugares Avaliados
                </p>
              </div>
            </div>
          </div>
          <div class="col-md-4 mb-3">
            <div
              class="card bg-warning text-dark border-0 shadow-sm"
              style="border-radius: 20px"
            >
              <div class="card-body text-center py-4">
                <h1 class="display-4 fw-bold" id="statAvg">0.0</h1>
                <p
                  class="mb-0 text-dark-50 fw-bold text-uppercase letter-spacing"
                >
                  Média de Notas
                </p>
              </div>
            </div>
          </div>
          <div class="col-md-4 mb-3">
            <div
              class="card bg-dark text-white border-0 shadow-sm"
              style="border-radius: 20px"
            >
              <div class="card-body text-center py-4">
                <h1 class="display-5 fw-bold mt-2 mb-3" id="statFav">-</h1>
                <p
                  class="mb-0 text-white-50 fw-bold text-uppercase letter-spacing"
                >
                  Categoria Favorita
                </p>
              </div>
            </div>
          </div>
        </div>

        <h4 class="fw-bold mb-4">Meu Histórico</h4>
        <div class="row g-4" id="profileFeedContainer"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
  </body>
</html>
